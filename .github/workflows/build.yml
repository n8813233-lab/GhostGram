name: Build GhostGram APK (inugram base)

# Phase-0 base proof for the inugram-base branch: stock Telegram 13.2.1 (pinned
# upstream commit 7be672ea) + inugram patchset, pluginless variant, materialized
# into a flat tree. Recipe follows inugram's own CI (.github/workflows/build.yml
# in teidesu/inugram): JDK 21, android-36 / build-tools 36.0.0 / cmake 3.31.6 /
# ndk 27.2.12479018, Rust target for the gram-wallet engine, assembleRelease.

on:
  workflow_dispatch:
  push:
    branches: [ inugram-base ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK components
        run: |
          SDKMANAGER=$(ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "cmake;3.31.6" "ndk;27.2.12479018"
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ndk-27.2-inugram-base
          max-size: 5G

      - name: Install wallet engine Rust target
        working-directory: TMessagesProj/jni/gram-wallet
        run: rustup target add aarch64-linux-android

      - name: Tune gradle
        run: |
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties

      - name: Build release APK (pluginless base, unsigned/debug-keyed)
        env:
          COMMIT_ID: ${{ github.sha }}
          INU_BUILD: '1'
          INU_BUILD_TYPE: release
          CCACHE_COMPILERCHECK: content
          CCACHE_SLOPPINESS: time_macros,file_macro,include_file_mtime,include_file_ctime,locale,system_headers
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :TMessagesProj_App:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostGram-inugram-base-release
          path: TMessagesProj_App/build/outputs/apk/release/*.apk
          if-no-files-found: error
