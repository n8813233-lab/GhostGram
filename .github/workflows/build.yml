name: Build GhostGram APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK components
        run: |
          SDKMANAGER=$(ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "ndk;21.4.7075529" "cmake;3.10.2.4988404"
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Generate CI keystore (throwaway, public CI credentials)
        run: |
          keytool -genkeypair -v \
            -keystore TMessagesProj/config/release.keystore \
            -alias ghostgramci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ghostgram-ci -keypass ghostgram-ci \
            -dname "CN=GhostGram CI, O=GhostGram, C=US"

      - name: Build release APK (afat)
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostGram-afat-release
          path: TMessagesProj_App/build/outputs/apk/**/afat/release/*.apk
          if-no-files-found: error
