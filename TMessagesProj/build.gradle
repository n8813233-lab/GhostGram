def inuSourceDir = file('src/inu/kotlin')
def inuGeneratedSources = layout.buildDirectory.dir('generated/inu/kotlin')
def inuSources = fileTree(inuSourceDir) {
    include '**/*.kt'
    if (rootProject.ext.inuPluginless) {
        exclude '**/helpers/plugins/**', '**/ui/settings/Plugin*.kt',
            '**/ui/settings/GrantPresentations.kt', '**/ui/settings/ButtonCellFactory.kt',
            '**/ui/settings/WarningBanner.kt'
    }
}
def preprocessInuSources = tasks.register('preprocessInuSources') {
    inputs.files(inuSources).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property('plugins', !rootProject.ext.inuPluginless)
    outputs.dir(inuGeneratedSources)
    doLast {
        def processed = inuSources.files.collectEntries { source ->
            def stack = []
            def active = true
            def output = new StringBuilder()
            source.getText('UTF-8').split('(?<=\n)', -1).eachWithIndex { line, index ->
                def directive = line =~ /^[\t ]*\/\/[\t ]*#(\w+)(?:[\t ]+([^\r\n]*?))?[\t ]*(?:\r?\n)?$/
                def newline = line.endsWith('\r\n') ? '\r\n' : line.endsWith('\n') ? '\n' : ''
                if (!directive.matches()) {
                    output.append(active ? line : newline)
                    return
                }
                def argument = directive.group(2)?.trim() ?: ''
                switch (directive.group(1)) {
                    case 'if':
                        if (argument != 'PLUGINS') throw new GradleException("${source}:${index + 1}: expected #if PLUGINS")
                        stack.add([parent: active, alternate: false, line: index + 1])
                        active = active && !rootProject.ext.inuPluginless
                        break
                    case 'else':
                        if (argument || stack.empty || stack.last().alternate) throw new GradleException("${source}:${index + 1}: unexpected #else")
                        stack.last().alternate = true
                        active = stack.last().parent && rootProject.ext.inuPluginless
                        break
                    case 'endif':
                        if (argument || stack.empty) throw new GradleException("${source}:${index + 1}: unexpected #endif")
                        active = stack.removeLast().parent
                        break
                    default:
                        throw new GradleException("${source}:${index + 1}: unknown directive #${directive.group(1)}")
                }
                output.append(newline)
            }
            if (!stack.empty) throw new GradleException("${source}:${stack.last().line}: unclosed #if")
            [(inuSourceDir.toPath().relativize(source.toPath()).toString()): output.toString()]
        }
        def targetDir = inuGeneratedSources.get().asFile
        delete targetDir
        processed.each { path, contents ->
            def target = new File(targetDir, path)
            target.parentFile.mkdirs()
            target.setText(contents, 'UTF-8')
        }
    }
}

// wallet-engine carries patches-native, so its committed prebuilt archive and bindings are stale
def inuWalletEngineDir = layout.buildDirectory.dir('inuWalletEngine').get().asFile
def buildInuWalletEngine = tasks.register('buildInuWalletEngine', Exec) {
    def abis = android.defaultConfig.ndk.abiFilters.join(' ')
    inputs.files(fileTree('jni/wallet-engine') { exclude '**/target/**', '.git' }, fileTree('jni/gram-wallet') { exclude 'target/**' },
        'jni/prebuild/build_wallet_engine.sh', 'jni/prebuild/common.sh').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property('abis', abis)
    inputs.property('ndk', android.ndkVersion)
    outputs.dirs(new File(inuWalletEngineDir, 'lib'), new File(inuWalletEngineDir, 'include'))
    outputs.cacheIf { true }
    def userHome = System.getProperty('user.home')
    environment 'PATH', [System.getenv('CARGO_HOME') ? "${System.getenv('CARGO_HOME')}/bin" : null, "$userHome/.cargo/bin", System.getenv('PATH')].findAll { it }.join(File.pathSeparator)
    environment 'ANDROID_NDK_HOME', android.ndkDirectory.absolutePath
    environment 'ABIS', abis
    environment 'LIB_DIR', new File(inuWalletEngineDir, 'lib').absolutePath
    environment 'INCLUDE_DIR', new File(inuWalletEngineDir, 'include').absolutePath
    environment 'WALLET_ENGINE_BUILD_DIR', new File(inuWalletEngineDir, 'cargo').absolutePath
    commandLine 'bash', file('jni/prebuild/build_wallet_engine.sh').absolutePath
}
tasks.matching { it.name.startsWith('configureCMake') || it.name.startsWith('buildCMake') }.configureEach {
    dependsOn buildInuWalletEngine
}

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    ndkVersion "27.2.12479018"

    sourceSets.androidTest.kotlin.srcDirs += ['src/androidTest/kotlin']
    sourceSets.main.kotlin.srcDir inuGeneratedSources
    if (rootProject.ext.inuPluginless) {
        sourceSets.androidTest.kotlin.setSrcDirs([])
        sourceSets.androidTest.assets.setSrcDirs([])
    } else {
        sourceSets.androidTest.jniLibs.srcDirs += ["$rootDir/TMessagesProj_App/build/inuTestJniLibs"]
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.31.6'
        }
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        buildConfigField "boolean", "INU_PLUGINLESS", rootProject.ext.inuPluginless.toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments package: "desu.inugram"
        minSdkVersion 26
        targetSdkVersion 36

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-26' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                arguments += ["-DINU_WALLET_ENGINE_DIR=${inuWalletEngineDir.absolutePath}"]
                targets 'tmessages.49'
                if (!rootProject.ext.inuPluginless) {
                    arguments += ['-DINU_EXPORT_SQLITE=ON']
                }
                if (rootProject.ext.ccachePath) {
                    arguments += ["-DCMAKE_C_COMPILER_LAUNCHER=${rootProject.ext.ccachePath}", "-DCMAKE_CXX_COMPILER_LAUNCHER=${rootProject.ext.ccachePath}"]
                }
            }
        }
    }

    buildTypes {
        debug {
            jniDebuggable true
            shrinkResources false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + rootProject.ext.verName + "\""
            buildConfigField "String", "BUILD_DATE", "\"" + rootProject.ext.buildDate + "\""
            buildConfigField "String", "INU_BUILD_TYPE", "\"" + (System.getenv('INU_BUILD_TYPE') ?: 'debug') + "\""
            buildConfigField "int", "STOCK_VERSION_CODE", String.valueOf(rootProject.ext.stockVerCode)
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
        }

        release {
            jniDebuggable false
            shrinkResources false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + rootProject.ext.verName + "\""
            buildConfigField "String", "BUILD_DATE", "\"" + rootProject.ext.buildDate + "\""
            buildConfigField "String", "INU_BUILD_TYPE", "\"" + (System.getenv('INU_BUILD_TYPE') ?: 'debug') + "\""
            buildConfigField "int", "STOCK_VERSION_CODE", String.valueOf(rootProject.ext.stockVerCode)
            buildConfigField "boolean", "DEBUG_VERSION", "false"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
            buildConfigField "boolean", "BUNDLE", "false"
        }
    }

    namespace 'org.telegram.messenger'
}


def getProps(String propName) {
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        return props[propName]
    } else {
        return "";
    }
}

task checkVisibility {
    doFirst {
        def isPrivateBuild = project.gradle.startParameter.taskNames.find {
            it.contains("HA_private") || it.contains("HA_hardcore") || it.contains("Debug") || it.contains("Release")
        }
        def isPublicAllowed = !project.hasProperty("IS_PRIVATE") || !project.property("IS_PRIVATE").toBoolean()
        if (!isPrivateBuild && !isPublicAllowed) {
            throw new GradleException("Building public version of private code!")
        }
    }
    doLast {
        if (project.gradle.startParameter.taskNames.find { it.contains("HA_public") }) {
            def privateBuild = file("${projectDir}_AppHockeyApp/afat/HA_private/Telegram-Beta.apk")
            if (privateBuild.exists()) {
                privateBuild.delete()
            }
        }
    }
}

preBuild.dependsOn checkVisibility, preprocessInuSources

if (!rootProject.ext.inuPluginless) {
    tasks.matching { it.name ==~ /merge.*AndroidTestJniLibFolders/ }.configureEach {
